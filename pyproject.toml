[project]
name = "morajai-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
]

[project.scripts]
morajai-solver = "morajai_solver.main:main"
bench = "benchmarks.benchmark:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "nuitka>=4.1.3",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.coverage.run]
omit = [
    "src/benchmarks/*",
    "src/morajai_solver/main.py",
    "src/morajai_solver/infra/logger.py"
]

[tool.ruff.lint]
ignore = [
    "PIE796",
    "C408",
    "BLE001"
]

[[tool.mypy.overrides]]
module = "customtkinter.*"
ignore_missing_imports = true
